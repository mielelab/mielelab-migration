title: MieleLab
description: "Disability Is Truly The Mother Of Invention — Joshua A. Miele is a blind scientist, designer, author, and disability scholar."
# NOTE: this repo is a staging site, served as a GitHub Pages *project* site
# at https://mielelab.github.io/mielelab-migration/ -- hence the baseurl below.
# When this content is promoted to the final production repo (served at the
# mielelab.com domain root), set baseurl back to "" or the site's assets/
# links will all 404. See README.md.
url: "https://mielelab.github.io"
baseurl: "/mielelab-migration"

# Staging site only: keeps this out of search results (robots.txt disallow +
# a sitewide noindex meta tag) so it doesn't get indexed as duplicate content
# ahead of the real mielelab.com. MUST be set to false at production cutover,
# alongside the url/baseurl change above.
noindex: true

author: Joshua A. Miele
email: issues@mielelab.com

# Contact form (Formspree)
formspree_id: "xqpzgwbe"

markdown: kramdown
kramdown:
  auto_ids: true
permalink: /blog/:title/

collections:
  projects:
    output: true
    permalink: /projects/:path/
  events:
    output: false
  blurbs:
    output: false

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post
  - scope:
      path: ""
      type: "projects"
    values:
      layout: project
  - scope:
      path: ""
    values:
      layout: page

sass:
  style: compressed

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-redirect-from

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - DESIGN-TOKENS.md
  - MIGRATION-ROADMAP.md
  - "*.xml"
  - node_modules
  - vendor
  - .bundle
