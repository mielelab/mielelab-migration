---
layout: default
---
<article class="container">
  <h1>{{ page.title }}</h1>
  <p class="post-meta">{{ page.date | date: "%B %-d, %Y" }}</p>
  {% if page.image %}
    <img src="{{ page.image | relative_url }}" alt="" style="border-radius:12px; margin-bottom:2rem;">
  {% endif %}
  {{ content }}
</article>
