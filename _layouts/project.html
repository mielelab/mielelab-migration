---
layout: default
---
<article class="container">
  <h1>{{ page.title }}</h1>
  {% if page.image %}
    <img src="{{ page.image | relative_url }}" alt="" style="border-radius:12px; margin-bottom:2rem; max-width:400px;">
  {% endif %}
  {{ content }}
  {% if page.external_link %}
    <p><a class="button" href="{{ page.external_link }}">Learn more</a></p>
  {% endif %}
  <p><a href="{{ '/projects/' | relative_url }}">&larr; Back to Projects &amp; Collaborations</a></p>
</article>
