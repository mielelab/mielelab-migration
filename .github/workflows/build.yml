name: Build and check

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build

      - name: Check links and images
        run: bundle exec htmlproofer ./_site --checks Images,Links --disable-external --allow-hash-href --swap-urls "^/mielelab-migration:"
